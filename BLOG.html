<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>30 个版本,2 周时间:我从零开始做了个 30KB 的 Obsidian 知识库 APP</title>
<meta name="author" content="Leo">
<meta name="date" content="2026-07-09">
<style>
:root {
  --primary: #00ffaa;
  --bg: #0a1a2a;
  --bg-2: #142a3e;
  --fg: #e8f0f5;
  --dim: #88aacc;
  --border: rgba(0,255,170,0.18);
  --code-bg: #0e2236;
}
@media (prefers-color-scheme: light) {
  :root {
    --bg: #ffffff;
    --bg-2: #f5f5f7;
    --fg: #1a1a1a;
    --dim: #555;
    --border: #ddd;
    --code-bg: #f4f4f4;
  }
}
* { box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--fg);
  max-width: 800px;
  margin: 0 auto;
  padding: 32px 24px 80px;
  line-height: 1.7;
}
nav#TOC {
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 16px 24px;
  margin-bottom: 32px;
}
nav#TOC ul { padding-left: 1.5em; }
nav#TOC a { color: var(--primary); text-decoration: none; }
nav#TOC a:hover { text-decoration: underline; }
h1, h2, h3, h4 { color: var(--primary); margin-top: 2em; line-height: 1.3; }
h1 {
  font-size: 2em; border-bottom: 1px solid var(--border);
  padding-bottom: 0.3em;
}
h2 {
  font-size: 1.5em; border-bottom: 1px solid var(--border);
  padding-bottom: 0.3em;
}
h3 { font-size: 1.2em; }
h4 { font-size: 1em; color: var(--dim); }
a { color: var(--primary); }
code, pre {
  font-family: "SF Mono", Menlo, Consolas, monospace;
  font-size: 13px;
}
code {
  background: var(--code-bg);
  padding: 1px 5px;
  border-radius: 3px;
  color: var(--primary);
}
pre {
  background: var(--code-bg);
  border: 1px solid var(--border);
  padding: 12px 16px;
  border-radius: 6px;
  overflow-x: auto;
  line-height: 1.5;
}
pre code { background: none; padding: 0; color: inherit; }
blockquote {
  border-left: 3px solid var(--primary);
  padding-left: 12px;
  color: var(--dim);
  margin-left: 0;
}
table {
  border-collapse: collapse;
  width: 100%;
  margin: 16px 0;
  font-size: 14px;
}
th, td {
  border: 1px solid var(--border);
  padding: 8px 12px;
  text-align: left;
}
th {
  background: var(--bg-2);
  font-weight: 600;
}
img.placeholder {
  display: block;
  margin: 16px auto;
  max-width: 100%;
  border: 2px dashed var(--border);
  background: var(--bg-2);
  padding: 40px 20px;
  text-align: center;
  color: var(--dim);
  border-radius: 8px;
  font-style: italic;
}
img { max-width: 100%; height: auto; display: block; margin: 16px auto; }
hr { border: none; border-top: 1px solid var(--border); margin: 32px 0; }
ul, ol { padding-left: 1.5em; }
li { margin: 4px 0; }
.meta { color: var(--dim); font-size: 14px; margin-bottom: 32px; }
footer { color: var(--dim); font-size: 12px; text-align: center; margin-top: 64px; }
</style>
</head>
<body>
<div class="meta">作者: Leo · 发布: 2026-07-09</div>

<footer>写于 2026 年 7 月 · 知识库 APP 推文 · 由 Leo 整理</footer>
</body>
</html>
